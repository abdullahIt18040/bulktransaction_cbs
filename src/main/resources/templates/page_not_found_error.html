<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
</head>
<body>

<h2>404 - Page Not Found</h2>

<!-- Show the error message from model -->
<div th:if="${error}">
    <p th:text="${error}">Error message will appear here</p>
</div>



</body>
</html>
